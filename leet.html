<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numerical Methods Trainer</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3250;
    --accent: #6c63ff;
    --accent2: #4ecdc4;
    --text: #e8eaf6;
    --text2: #9099c8;
    --pass: #2ecc71;
    --fail: #e74c3c;
    --warn: #f39c12;
    --code-bg: #0d1117;
    --radius: 10px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  [data-theme="light"] {
    --bg: #f0f2f8;
    --surface: #ffffff;
    --surface2: #e8ecf5;
    --border: #d0d8ee;
    --accent: #5a52e0;
    --accent2: #3db8b0;
    --text: #1a1d2e;
    --text2: #5a6080;
    --pass: #27ae60;
    --fail: #c0392b;
    --warn: #d68910;
    --code-bg: #f8f9fc;
    --shadow: 0 4px 24px rgba(0,0,0,0.10);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 15px; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    height: 62px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }
  .logo {
    font-size: 1.2rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    white-space: nowrap;
  }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 1rem; }
  .progress-pill {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 0.82rem;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .progress-pill .count { color: var(--accent); font-weight: 700; }
  .btn {
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 7px 16px;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text2); }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: rgba(231,76,60,0.12); color: var(--fail); border: 1.5px solid rgba(231,76,60,0.25); }
  .btn-danger:hover { background: rgba(231,76,60,0.22); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    box-shadow: 0 2px 12px rgba(108,99,255,0.3);
  }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .theme-toggle {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 50%;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 1.1rem;
    transition: all 0.2s;
    color: var(--text);
  }
  .theme-toggle:hover { border-color: var(--accent); }
  .main-layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: calc(100vh - 62px);
  }
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 1rem 0;
  }
  .sidebar::-webkit-scrollbar { width: 5px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .sidebar-search { padding: 0 12px 12px; }
  .sidebar-search input {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    color: var(--text);
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .sidebar-search input:focus { border-color: var(--accent); }
  .sidebar-search input::placeholder { color: var(--text2); }
  .category-header {
    padding: 8px 16px 4px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text2);
  }
  .task-item {
    padding: 8px 16px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.87rem;
    color: var(--text2);
    line-height: 1.3;
  }
  .task-item:hover { background: var(--surface2); color: var(--text); }
  .task-item.active { border-left-color: var(--accent); background: rgba(108,99,255,0.08); color: var(--text); }
  .task-item.solved .status-dot { background: var(--pass); }
  .task-item .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
  .content { display: flex; flex-direction: column; overflow: hidden; }
  .task-header {
    padding: 18px 28px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .task-title {
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .category-badge {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 20px;
    background: rgba(108,99,255,0.12);
    color: var(--accent);
    border: 1px solid rgba(108,99,255,0.2);
  }
  .task-description { font-size: 0.88rem; color: var(--text2); line-height: 1.6; margin-top: 6px; max-width: 820px; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 0; flex: 1; overflow: hidden; }
  .panel-left { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .panel-label {
    padding: 9px 16px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text2);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .editor-wrap { flex: 1; overflow: hidden; background: var(--code-bg); }
  textarea#code-editor {
    width: 100%;
    height: 100%;
    background: var(--code-bg);
    color: var(--text);
    border: none;
    outline: none;
    resize: none;
    padding: 16px;
    font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace;
    font-size: 0.87rem;
    line-height: 1.65;
    tab-size: 4;
    -moz-tab-size: 4;
    caret-color: var(--accent);
  }
  textarea#code-editor::selection { background: rgba(108,99,255,0.3); }
  .run-bar {
    padding: 10px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .pyodide-status { font-size: 0.78rem; color: var(--text2); display: flex; align-items: center; gap: 6px; }
  .pyodide-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); animation: pulse 1.5s infinite; }
  .pyodide-status.ready .dot { background: var(--pass); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .panel-right { display: flex; flex-direction: column; overflow: hidden; background: var(--surface); }
  .results-container { flex: 1; overflow-y: auto; padding: 16px; }
  .results-container::-webkit-scrollbar { width: 5px; }
  .results-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .result-placeholder { color: var(--text2); font-size: 0.9rem; text-align: center; margin-top: 60px; }
  .result-placeholder .icon { font-size: 2.5rem; margin-bottom: 10px; }
  .verdict-banner {
    border-radius: var(--radius);
    padding: 12px 18px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 1rem;
  }
  .verdict-banner.pass { background: rgba(46,204,113,0.12); border: 1.5px solid rgba(46,204,113,0.25); color: var(--pass); }
  .verdict-banner.fail { background: rgba(231,76,60,0.12); border: 1.5px solid rgba(231,76,60,0.25); color: var(--fail); }
  .verdict-banner.error { background: rgba(243,156,18,0.12); border: 1.5px solid rgba(243,156,18,0.25); color: var(--warn); }
  .test-case { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
  .test-case-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; user-select: none; }
  .test-case-header:hover { background: rgba(255,255,255,0.03); }
  .tc-badge { font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
  .tc-badge.pass { background: rgba(46,204,113,0.15); color: var(--pass); }
  .tc-badge.fail { background: rgba(231,76,60,0.15); color: var(--fail); }
  .test-case-title { font-size: 0.87rem; font-weight: 600; flex: 1; }
  .test-case-body { padding: 0 14px 12px; display: none; }
  .test-case-body.open { display: block; }
  .tc-detail {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--text2);
    background: var(--code-bg);
    border-radius: 6px;
    padding: 10px 12px;
    margin-top: 8px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 200px;
    overflow-y: auto;
    line-height: 1.6;
  }
  .tc-detail.error-text { color: var(--fail); }
  #loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,17,23,0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.85s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: var(--text2); font-size: 0.95rem; }
  .loading-sub { color: var(--text2); font-size: 0.8rem; margin-top: 6px; opacity: 0.6; }
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 18px;
    font-size: 0.88rem;
    box-shadow: var(--shadow);
    z-index: 9998;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.pass { border-color: rgba(46,204,113,0.4); color: var(--pass); }
  .toast.fail { border-color: rgba(231,76,60,0.4); color: var(--fail); }
  .hint-toggle { font-size: 0.78rem; color: var(--accent); cursor: pointer; text-decoration: underline; margin-top: 8px; display: inline-block; }
  .hint-box {
    background: rgba(108,99,255,0.07);
    border: 1px solid rgba(108,99,255,0.2);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.83rem;
    color: var(--text2);
    margin-top: 8px;
    display: none;
    line-height: 1.6;
  }
  .hint-box.open { display: block; }
  kbd { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: 0.78rem; font-family: monospace; color: var(--text2); }
  @media (max-width: 900px) {
    .main-layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .panels { grid-template-columns: 1fr; }
    .panel-left { border-right: none; border-bottom: 1px solid var(--border); height: 45vh; }
  }
</style>
</head>
<body data-theme="dark">

<div id="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text">Loading Pyodide Python Runtime...</div>
  <div class="loading-sub">This may take a moment on first load</div>
</div>

<header>
  <span class="logo">⚡ Numerical Methods Trainer</span>
  <div class="header-right">
    <div class="progress-pill">
      Progress: <span class="count" id="progress-count">0</span>&nbsp;/&nbsp;<span id="total-count">0</span>
    </div>
    <button class="btn btn-danger" onclick="App.resetProgress()">↺ Reset</button>
    <button class="theme-toggle" id="theme-btn" onclick="App.toggleTheme()" title="Toggle theme">🌙</button>
  </div>
</header>

<div class="main-layout">
  <aside class="sidebar">
    <div class="sidebar-search">
      <input type="text" placeholder="🔍 Search tasks..." id="search-input" oninput="App.filterTasks(this.value)">
    </div>
    <div id="task-list"></div>
  </aside>

  <main class="content">
    <div class="task-header">
      <div class="task-title" id="task-title">Select a Task</div>
      <div class="task-description" id="task-description">Choose a numerical method from the sidebar to begin.</div>
      <span class="hint-toggle" id="hint-toggle" onclick="App.toggleHint()" style="display:none">💡 Show Hint</span>
      <div class="hint-box" id="hint-box"></div>
    </div>

    <div class="panels">
      <div class="panel-left">
        <div class="panel-label">
          <span>🐍 Python Editor</span>
          <span style="margin-left:auto;font-size:0.7rem;opacity:0.6"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> to run</span>
        </div>
        <div class="editor-wrap">
          <textarea id="code-editor" spellcheck="false" placeholder="Select a task to start coding..."></textarea>
        </div>
        <div class="run-bar">
          <button class="btn btn-primary" id="run-btn" onclick="App.runCode()" disabled>▶ Run Tests</button>
          <button class="btn btn-outline" onclick="App.resetCode()">⟲ Reset</button>
          <div class="pyodide-status" id="pyodide-status">
            <div class="dot"></div><span>Loading Python...</span>
          </div>
        </div>
      </div>

      <div class="panel-right">
        <div class="panel-label">📊 Test Results</div>
        <div class="results-container" id="results-container">
          <div class="result-placeholder">
            <div class="icon">🧮</div>
            <div>Run your code to see test results</div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================================
// TASK DEFINITIONS — 35 numerical methods across 8 categories
// ============================================================================
const TASKS = [
  // ── ROOT FINDING ──────────────────────────────────────────────────────────
  {
    id:"bisection", category:"Root Finding", title:"Bisection Method",
    description:"Implement the bisection method to find the root of f(x) on interval [a, b] where f(a)*f(b) < 0. Halve the interval repeatedly until |b-a| < tol.",
    hint:"Compute mid = (a+b)/2, evaluate f(mid). If f(a)*f(mid) < 0, root is in [a,mid], else in [mid,b]. Repeat until converged.",
    template:`def bisection(f, a, b, tol=1e-6, max_iter=1000):
    """
    Find root of f in [a,b] using bisection method.
    Returns: float - approximate root
    """
    pass`,
    tests:[
      {name:"Root of x²-2 in [1,2]",setup:"import math\nf=lambda x:x**2-2\nresult=bisection(f,1.0,2.0,tol=1e-8)",check:"abs(result-math.sqrt(2))<1e-6",expected:"√2 ≈ 1.41421356"},
      {name:"Root of x³-x-2 in [1,2]",setup:"f=lambda x:x**3-x-2\nresult=bisection(f,1.0,2.0,tol=1e-8)",check:"abs(result-1.5213797)<1e-5",expected:"≈ 1.5213797"},
      {name:"Root of cos(x)-x in [0,1]",setup:"import math\nf=lambda x:math.cos(x)-x\nresult=bisection(f,0.0,1.0,tol=1e-8)",check:"abs(result-0.7390851)<1e-5",expected:"≈ 0.7390851"}
    ]
  },
  {
    id:"fixed_point", category:"Root Finding", title:"Fixed-Point Iteration",
    description:"Implement fixed-point iteration: x_{n+1} = g(x_n) until |x_{n+1} - x_n| < tol. Requires g to be a contraction mapping near the fixed point.",
    hint:"Start from x0. Iterate x = g(x) until consecutive values are close enough. Check |new - old| < tol.",
    template:`def fixed_point(g, x0, tol=1e-6, max_iter=1000):
    """
    Find fixed point of g(x)=x using iteration.
    Returns: float - approximate fixed point
    """
    pass`,
    tests:[
      {name:"Fixed point of cos(x)",setup:"import math\ng=lambda x:math.cos(x)\nresult=fixed_point(g,0.5,tol=1e-8)",check:"abs(result-0.7390851)<1e-5",expected:"≈ 0.7390851"},
      {name:"Fixed point of (x+2/x)/2 → √2",setup:"g=lambda x:(x+2.0/x)/2.0\nresult=fixed_point(g,1.5,tol=1e-8)",check:"abs(result-1.41421356)<1e-5",expected:"√2 ≈ 1.41421356"}
    ]
  },
  {
    id:"newton_raphson", category:"Root Finding", title:"Newton-Raphson Method",
    description:"Implement Newton-Raphson: x_{n+1} = x_n - f(x_n)/f'(x_n). Requires the derivative f'. Quadratic convergence near simple roots.",
    hint:"Check if |f'(x)| is too small (near-zero) and raise or handle gracefully. Iterate until |f(x)| < tol.",
    template:`def newton_raphson(f, df, x0, tol=1e-6, max_iter=1000):
    """
    Find root of f using Newton-Raphson.
    Returns: float - approximate root
    """
    pass`,
    tests:[
      {name:"Root of x²-2",setup:"f=lambda x:x**2-2\ndf=lambda x:2*x\nresult=newton_raphson(f,df,1.5,tol=1e-10)",check:"abs(result**2-2)<1e-8",expected:"√2 ≈ 1.41421356"},
      {name:"Root of x³-x-2",setup:"f=lambda x:x**3-x-2\ndf=lambda x:3*x**2-1\nresult=newton_raphson(f,df,1.5,tol=1e-10)",check:"abs(result-1.5213797)<1e-5",expected:"≈ 1.5213797"},
      {name:"Root of exp(x)-3",setup:"import math\nf=lambda x:math.exp(x)-3\ndf=lambda x:math.exp(x)\nresult=newton_raphson(f,df,1.0,tol=1e-10)",check:"abs(result-math.log(3))<1e-7",expected:"ln(3) ≈ 1.09861"}
    ]
  },
  {
    id:"secant", category:"Root Finding", title:"Secant Method",
    description:"Implement the secant method: x_{n+1} = x_n - f(x_n)*(x_n-x_{n-1})/(f(x_n)-f(x_{n-1})). No derivative needed.",
    hint:"Use two initial points. The secant line approximates the derivative. Handle f(x_n)==f(x_{n-1}) to avoid division by zero.",
    template:`def secant(f, x0, x1, tol=1e-6, max_iter=1000):
    """
    Find root of f using secant method.
    Returns: float - approximate root
    """
    pass`,
    tests:[
      {name:"Root of x²-2",setup:"f=lambda x:x**2-2\nresult=secant(f,1.0,2.0,tol=1e-8)",check:"abs(result**2-2)<1e-6",expected:"√2 ≈ 1.41421356"},
      {name:"Root of x³-x-2",setup:"f=lambda x:x**3-x-2\nresult=secant(f,1.0,2.0,tol=1e-8)",check:"abs(result-1.5213797)<1e-5",expected:"≈ 1.5213797"}
    ]
  },
  {
    id:"false_position", category:"Root Finding", title:"False Position (Regula Falsi)",
    description:"Implement Regula Falsi: like bisection but use linear interpolation c = a - f(a)*(b-a)/(f(b)-f(a)) instead of the midpoint.",
    hint:"Compute c = a - f(a)*(b-a)/(f(b)-f(a)). Replace a or b with c based on the sign of f(c), keeping a sign change.",
    template:`def false_position(f, a, b, tol=1e-6, max_iter=1000):
    """
    Find root of f in [a,b] using Regula Falsi.
    Returns: float - approximate root
    """
    pass`,
    tests:[
      {name:"Root of x²-2 in [1,2]",setup:"import math\nf=lambda x:x**2-2\nresult=false_position(f,1.0,2.0,tol=1e-8)",check:"abs(result-math.sqrt(2))<1e-5",expected:"√2 ≈ 1.41421356"},
      {name:"Root of x³-x-2 in [1,2]",setup:"f=lambda x:x**3-x-2\nresult=false_position(f,1.0,2.0,tol=1e-8)",check:"abs(result-1.5213797)<1e-5",expected:"≈ 1.5213797"}
    ]
  },
  {
    id:"muller", category:"Root Finding", title:"Muller's Method",
    description:"Implement Muller's method: fit a quadratic through three points and find the root nearest to x2 using the quadratic formula.",
    hint:"h0=x1-x0, h1=x2-x1, δ0=(f1-f0)/h0, δ1=(f2-f1)/h1, a=(δ1-δ0)/(h1+h0), b=a*h1+δ1, c=f2. Root: x2 - 2c/(b±√(b²-4ac)).",
    template:`def muller(f, x0, x1, x2, tol=1e-6, max_iter=100):
    """
    Find root of f using Muller's method.
    Returns: float (real part of approximate root)
    """
    pass`,

// ============================================================================
// APPLICATION MODULE
// ============================================================================
const App = (() => {
  let pyodide = null;
  let currentTask = null;
  let solved = new Set();
  const STORAGE_KEY = 'nm_trainer_v4';

  // ── PERSISTENCE ────────────────────────────────────────────────────────────
  function loadProgress() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) { const d = JSON.parse(raw); solved = new Set(d.solved || []); }
    } catch(_) {}
  }

  function saveProgress() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({solved:[...solved]})); } catch(_) {}
  }

  function resetProgress() {
    if (!confirm('Reset all progress? This cannot be undone.')) return;
    solved = new Set();
    saveProgress();
    renderSidebar();
    updateProgressCount();
    showToast('Progress reset!', 'fail');
  }

  function toggleTheme() {
    const isDark = document.body.getAttribute('data-theme') === 'dark';
    document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('theme-btn').textContent = isDark ? '🌙' : '☀️';
  }

  function updateProgressCount() {
    document.getElementById('progress-count').textContent = solved.size;
    document.getElementById('total-count').textContent = TASKS.length;
  }

  // ── SIDEBAR ────────────────────────────────────────────────────────────────
  function renderSidebar(filter = '') {
    const container = document.getElementById('task-list');
    const categories = {};
    TASKS.forEach(t => { if (!categories[t.category]) categories[t.category]=[]; categories[t.category].push(t); });
    const fl = filter.toLowerCase();
    let html = '';
    for (const [cat, tasks] of Object.entries(categories)) {
      const filtered = tasks.filter(t => !fl || t.title.toLowerCase().includes(fl) || cat.toLowerCase().includes(fl));
      if (!filtered.length) continue;
      html += `<div class="category-header">${cat}</div>`;
      filtered.forEach(task => {
        const isSolved = solved.has(task.id);
        const isActive = currentTask && currentTask.id === task.id;
        html += `<div class="task-item${isSolved?' solved':''}${isActive?' active':''}" onclick="App.selectTask('${task.id}')">
          <div class="status-dot"></div><span>${task.title}</span></div>`;
      });
    }
    container.innerHTML = html;
  }

  function filterTasks(val) { renderSidebar(val); }

  // ── TASK SELECTION ─────────────────────────────────────────────────────────
  function selectTask(id) {
    currentTask = TASKS.find(t => t.id === id);
    if (!currentTask) return;
    document.getElementById('task-title').innerHTML =
      `${currentTask.title} <span class="category-badge">${currentTask.category}</span>`;
    document.getElementById('task-description').textContent = currentTask.description;
    const hintToggle = document.getElementById('hint-toggle');
    const hintBox = document.getElementById('hint-box');
    hintToggle.style.display = 'inline-block';
    hintBox.textContent = currentTask.hint;
    hintBox.classList.remove('open');
    hintToggle.textContent = '💡 Show Hint';
    const savedCode = localStorage.getItem(`nm_code_${id}`);
    document.getElementById('code-editor').value = savedCode || currentTask.template;
    document.getElementById('results-container').innerHTML = `
      <div class="result-placeholder"><div class="icon">▶️</div>
      <div>Press <b>Run Tests</b> or use <b>Ctrl+Enter</b></div></div>`;
    renderSidebar(document.getElementById('search-input').value);
    if (pyodide) document.getElementById('run-btn').disabled = false;
  }

  function toggleHint() {
    const box = document.getElementById('hint-box');
    const tog = document.getElementById('hint-toggle');
    box.classList.toggle('open');
    tog.textContent = box.classList.contains('open') ? '🙈 Hide Hint' : '💡 Show Hint';
  }

  function resetCode() {
    if (!currentTask) return;
    if (confirm('Reset code to template?')) {
      document.getElementById('code-editor').value = currentTask.template;
      localStorage.removeItem(`nm_code_${currentTask.id}`);
    }
  }

  // ── PYTHON EXECUTION ───────────────────────────────────────────────────────
  async function runCode() {
    if (!currentTask || !pyodide) return;
    const btn = document.getElementById('run-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Running...';

    const code = document.getElementById('code-editor').value;
    localStorage.setItem(`nm_code_${currentTask.id}`, code);

    let globalError = null;
    const results = [];

    // First check code compiles
    try { await pyodide.runPythonAsync(code); }
    catch(e) { globalError = e.message || String(e); }

    if (!globalError) {
      for (const tc of currentTask.tests) {
        results.push(await runSingleTest(code, tc));
      }
    }

    const allPassed = !globalError && results.every(r => r.passed);
    renderResults(results, allPassed, globalError);

    if (allPassed) {
      const isNew = !solved.has(currentTask.id);
      solved.add(currentTask.id);
      saveProgress();
      updateProgressCount();
      renderSidebar(document.getElementById('search-input').value);
      showToast(isNew ? '🎉 All tests passed!' : '✅ All tests passed!', 'pass');
    } else if (globalError) {
      showToast('⚠️ Runtime error in your code', 'fail');
    } else {
      showToast('❌ Some tests failed', 'fail');
    }

    btn.disabled = false;
    btn.textContent = '▶ Run Tests';
  }

  async function runSingleTest(userCode, tc) {
    const indented = userCode.split('\n').map(l => '    ' + l).join('\n');
    const setupLines = tc.setup.split('\n');
    const setupIndented = setupLines.map(l => '    ' + l).join('\n');
    const checkLine = '    _check_result = bool(' + tc.check + ')';

    const fullCode = `
import math, traceback as _tb
_passed = False
_error = ""
try:
${indented}
${setupIndented}
${checkLine}
    _passed = _check_result
except Exception as _e:
    _error = _tb.format_exc()

import js as _js
_js.window._test_passed = _passed
_js.window._test_error = _error
`;
    try {
      window._test_passed = false;
      window._test_error = '';
      const runP = pyodide.runPythonAsync(fullCode);
      const timeout = new Promise((_,rej) => setTimeout(() => rej(new Error('Timeout: possible infinite loop (>8s)')), 8000));
      await Promise.race([runP, timeout]);
      return { name: tc.name, passed: window._test_passed === true, error: window._test_error || null, expected: tc.expected };
    } catch(e) {
      return { name: tc.name, passed: false, error: e.message || String(e), expected: tc.expected };
    }
  }

  // ── RENDER RESULTS ─────────────────────────────────────────────────────────
  function renderResults(results, allPassed, globalError) {
    const container = document.getElementById('results-container');
    if (globalError) {
      container.innerHTML = `
        <div class="verdict-banner error">⚠️ Runtime Error</div>
        <div class="test-case">
          <div class="test-case-header" onclick="this.nextElementSibling.classList.toggle('open')">
            <span class="tc-badge fail">ERR</span>
            <span class="test-case-title">Check your code syntax and logic</span>
            <span style="color:var(--text2);font-size:0.8rem">▾ Details</span>
          </div>
          <div class="test-case-body open">
            <div class="tc-detail error-text">${escHtml(globalError)}</div>
          </div>
        </div>`;
      return;
    }
    const passed = results.filter(r => r.passed).length;
    const total = results.length;
    const cls = allPassed ? 'pass' : 'fail';
    const icon = allPassed ? '✅' : '❌';
    let html = `<div class="verdict-banner ${cls}">${icon} ${passed}/${total} tests passed</div>`;
    results.forEach((r, i) => {
      const bc = r.passed ? 'pass' : 'fail';
      const bt = r.passed ? 'PASS' : 'FAIL';
      html += `<div class="test-case">
        <div class="test-case-header" onclick="this.nextElementSibling.classList.toggle('open')">
          <span class="tc-badge ${bc}">${bt}</span>
          <span class="test-case-title">Test ${i+1}: ${escHtml(r.name)}</span>
          <span style="color:var(--text2);font-size:0.8rem">▾</span>
        </div>
        <div class="test-case-body${r.error ? ' open' : ''}">
          <div style="font-size:0.82rem;color:var(--text2);margin-top:4px"><b>Expected:</b> ${escHtml(r.expected)}</div>
          ${r.error ? `<div class="tc-detail error-text">${escHtml(r.error)}</div>` : ''}
          ${!r.error && r.passed ? '<div class="tc-detail" style="color:var(--pass)">✓ Passed numerical tolerance check</div>' : ''}
          ${!r.error && !r.passed ? '<div class="tc-detail error-text">✗ Result outside numerical tolerance — check your algorithm</div>' : ''}
        </div>
      </div>`;
    });
    container.innerHTML = html;
  }

  // ── UTILITIES ──────────────────────────────────────────────────────────────
  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => { t.className = 'toast'; }, 2800);
  }

  function escHtml(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── PYODIDE INIT ───────────────────────────────────────────────────────────
  async function initPyodide() {
    try {
      pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.25.1/full/" });
      document.getElementById('loading-overlay').style.display = 'none';
      const s = document.getElementById('pyodide-status');
      s.classList.add('ready');
      s.innerHTML = '<div class="dot"></div><span>Python ready</span>';
      if (currentTask) document.getElementById('run-btn').disabled = false;
    } catch(e) {
      document.getElementById('loading-overlay').innerHTML = `
        <div style="color:#e74c3c;font-size:1rem;text-align:center;padding:2rem">
          ⚠️ Failed to load Pyodide<br><small style="opacity:0.7">${e.message}</small>
          <br><br><small>Check internet connection and refresh</small></div>`;
    }
  }

  // ── INIT ───────────────────────────────────────────────────────────────────
  function init() {
    loadProgress();
    renderSidebar();
    updateProgressCount();

    // Tab key support in editor
    document.getElementById('code-editor').addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        if (!document.getElementById('run-btn').disabled) runCode();
      }
      if (e.key === 'Tab') {
        e.preventDefault();
        const ta = e.target, s = ta.selectionStart, en = ta.selectionEnd;
        ta.value = ta.value.substring(0,s) + '    ' + ta.value.substring(en);
        ta.selectionStart = ta.selectionEnd = s + 4;
      }
    });

    initPyodide();
    if (TASKS.length > 0) selectTask(TASKS[0].id);
  }

  return { init, selectTask, filterTasks, runCode, resetCode, resetProgress, toggleTheme, toggleHint };
})();

document.addEventListener('DOMContentLoaded', () => App.init());
</script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
</body>
