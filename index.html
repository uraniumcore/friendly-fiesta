<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computational Mathematics — Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0d1117;
    --surface:   #161b22;
    --surface2:  #1c2230;
    --border:    #21262d;
    --amber:     #f0a500;
    --amber-dim: #b07800;
    --green:     #3fb950;
    --red:       #f85149;
    --text:      #e6edf3;
    --muted:     #8b949e;
    --code-bg:   #0b0f14;
    --radius:    10px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-weight: 400;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 1rem 6rem;
  }

  /* ── HEADER ── */
  header {
    width: 100%;
    max-width: 780px;
    padding: 2.5rem 0 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2rem;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--amber);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(1.8rem, 4vw, 2.5rem);
    font-weight: 400;
    line-height: 1.15;
  }
  header p {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 0.1rem;
  }
  header p code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8em;
    color: var(--amber);
  }

  /* ── SETUP SCREEN ── */
  #setup-screen { width: 100%; max-width: 780px; animation: fadein 0.3s ease; }
  .setup-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
  }
  .setup-card h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.3rem;
    font-weight: 400;
    margin-bottom: 0.35rem;
  }
  .setup-card .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.75rem; }

  .setup-row {
    display: flex;
    align-items: center;
    gap: 1.25rem;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }
  .setup-row label { font-size: 0.88rem; color: var(--muted); white-space: nowrap; }

  .count-pills { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .pill {
    padding: 0.4rem 0.9rem;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .pill:hover { border-color: var(--amber); color: var(--text); }
  .pill.active { border-color: var(--amber); background: #1e1a0e; color: var(--amber); }

  .custom-count { display: flex; align-items: center; gap: 0.5rem; }
  .custom-count input[type="number"] {
    width: 70px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    padding: 0.35rem 0.6rem;
    outline: none;
    transition: border-color 0.15s;
  }
  .custom-count input:focus { border-color: var(--amber); }
  .custom-count span { font-size: 0.8rem; color: var(--muted); }

  .start-btn {
    padding: 0.65rem 2rem;
    background: var(--amber);
    border: none;
    border-radius: 7px;
    color: #000;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .start-btn:hover  { opacity: 0.88; }
  .start-btn:active { transform: scale(0.98); }
  .start-btn:disabled { opacity: 0.38; cursor: not-allowed; }

  /* ── PROGRESS BAR ── */
  #quiz-header {
    width: 100%;
    max-width: 780px;
    display: none;
    flex-direction: column;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
    animation: fadein 0.3s ease;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
  }
  .progress-track { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill {
    height: 100%;
    background: var(--amber);
    border-radius: 2px;
    width: 0%;
    transition: width 0.35s ease;
  }

  /* ── QUIZ SCREEN ── */
  #quiz-screen { display: none; width: 100%; max-width: 780px; }
  .quiz-container { display: flex; flex-direction: column; gap: 1.25rem; }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem;
    position: relative;
    overflow: hidden;
    transition: border-color 0.25s;
    animation: fadein 0.25s ease both;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: transparent;
    transition: background 0.3s;
  }
  .card.result-correct::before { background: var(--green); }
  .card.result-wrong::before   { background: var(--red); }
  .card.result-skipped::before { background: var(--muted); }

  .card-header { display: flex; align-items: flex-start; gap: 1rem; margin-bottom: 1.1rem; }
  .q-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--amber);
    background: #1e1a0e;
    border: 1px solid var(--amber-dim);
    border-radius: 5px;
    padding: 0.18rem 0.5rem;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 0.2rem;
  }
  .q-text { font-size: 0.98rem; line-height: 1.65; font-weight: 500; }

  /* ── CODE BLOCK ── */
  .code-block {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 0.9rem 1.1rem;
    margin: 0.65rem 0 1rem;
    overflow-x: auto;
  }
  .code-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 0.45rem;
  }
  .code-block pre {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.77rem;
    line-height: 1.75;
    color: #cdd9e5;
    white-space: pre;
  }

  /* ── OPTIONS ── */
  .options-list { display: flex; flex-direction: column; gap: 0.55rem; margin-top: 0.2rem; }
  .option-btn {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.65rem 1rem;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 0.87rem;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
    width: 100%;
    line-height: 1.45;
  }
  .option-btn:hover:not(:disabled):not(.selected) {
    border-color: #444c5a;
    background: var(--surface2);
  }
  .option-btn .opt-key {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    background: var(--border);
    border-radius: 4px;
    padding: 0.1rem 0.42rem;
    flex-shrink: 0;
    min-width: 22px;
    text-align: center;
    transition: background 0.12s, color 0.12s;
  }
  /* pre-submit selection */
  .option-btn.selected { border-color: var(--amber); background: #1e1a0e; }
  .option-btn.selected .opt-key { background: var(--amber); color: #000; }
  /* post-submit reveal */
  .option-btn.reveal-correct { border-color: var(--green); background: #0d1f12; }
  .option-btn.reveal-correct .opt-key { background: var(--green); color: #000; }
  .option-btn.reveal-wrong   { border-color: var(--red);   background: #1f0d0d; }
  .option-btn.reveal-wrong .opt-key   { background: var(--red);   color: #fff; }
  .option-btn:disabled { cursor: default; }

  .skipped-notice { font-size: 0.8rem; color: var(--muted); font-style: italic; margin-top: 0.5rem; display: none; }
  .skipped-notice.visible { display: block; }

  /* ── EXPLANATION ── */
  .explanation {
    margin-top: 1rem;
    padding: 0.8rem 1rem;
    background: #0b0e14;
    border-left: 3px solid var(--amber);
    border-radius: 0 6px 6px 0;
    font-size: 0.83rem;
    line-height: 1.7;
    color: #cdd9e5;
    display: none;
  }
  .explanation.visible { display: block; animation: fadein 0.2s ease; }
  .explanation .exp-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.63rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--amber);
    margin-bottom: 0.35rem;
  }

  /* ── STICKY SUBMIT BAR ── */
  #submit-bar {
    width: 100%;
    max-width: 780px;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-top: 1.5rem;
    padding: 1.1rem 1.4rem;
    background: #161b22ee;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    position: sticky;
    bottom: 1.5rem;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    animation: fadein 0.3s ease;
    flex-wrap: wrap;
  }
  .submit-meta { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--muted); }
  .submit-meta strong { color: var(--text); }
  .submit-btn {
    padding: 0.58rem 1.6rem;
    background: var(--amber);
    border: none;
    border-radius: 7px;
    color: #000;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s, transform 0.1s;
  }
  .submit-btn:hover  { opacity: 0.88; }
  .submit-btn:active { transform: scale(0.98); }

  /* ── RESULTS PANEL ── */
  #results-panel { display: none; width: 100%; max-width: 780px; margin-top: 2rem; animation: fadein 0.4s ease; }
  .results-summary {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    text-align: center;
    margin-bottom: 1.5rem;
  }
  .results-summary h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    font-weight: 400;
    margin-bottom: 0.75rem;
  }
  .score-fraction {
    font-family: 'JetBrains Mono', monospace;
    font-size: 3.2rem;
    font-weight: 600;
    color: var(--amber);
    line-height: 1;
    margin-bottom: 0.5rem;
  }
  .score-pct { font-size: 0.9rem; color: var(--muted); margin-bottom: 1.5rem; }
  .results-pills { display: flex; justify-content: center; gap: 1.75rem; flex-wrap: wrap; margin-bottom: 1.75rem; }
  .res-stat { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; }
  .res-stat .val { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; }
  .res-stat .lbl { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .res-stat.correct .val  { color: var(--green); }
  .res-stat.wrong   .val  { color: var(--red); }
  .res-stat.skipped .val  { color: var(--muted); }

  .action-row { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
  .action-btn {
    padding: 0.6rem 1.4rem;
    border-radius: 7px;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .action-btn.primary   { background: var(--amber); border: none; color: #000; }
  .action-btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .action-btn:hover { opacity: 0.82; }

  /* ── STATE CARDS ── */
  .state-card {
    width: 100%;
    max-width: 780px;
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
  }
  .state-card .icon { font-size: 2.5rem; margin-bottom: 1rem; opacity: 0.45; }
  .state-card h3 { font-family: 'DM Serif Display', serif; font-size: 1.3rem; color: var(--text); font-weight: 400; margin-bottom: 0.5rem; }
  .state-card p  { font-size: 0.85rem; line-height: 1.7; }
  .state-card code { font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; color: var(--amber); }
  .state-card.error .icon { opacity: 0.7; color: var(--red); }
  .state-card.error h3 { color: var(--red); }

  @keyframes fadein {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Computational Mathematics</div>
  <h1>Practice Quiz</h1>
  <p>Questions loaded automatically from <code>quiz-data.json</code> — keep both files in the same folder and serve via a local server.</p>
</header>

<!-- Loading / error placeholder -->
<div id="state-placeholder"></div>

<!-- ── SETUP SCREEN ── -->
<div id="setup-screen" style="display:none">
  <div class="setup-card">
    <h2>Configure your session</h2>
    <p class="sub" id="setup-sub">Loading…</p>
    
    <div class="setup-row">
      <label>Dataset</label>
      <div class="count-pills" id="dataset-pills">
        <button class="pill" id="pill-curated" onclick="selectDataset('new-quiz-data.json', this)">Curated (20 qs)</button>
        <button class="pill active" id="pill-full" onclick="selectDataset('quiz-data.json', this)">All questions (55 qs)</button>
      </div>
    </div>
    
    <div class="setup-row">
      <label>Questions</label>
      <div class="count-pills" id="count-pills"></div>
      <div class="custom-count">
        <input type="number" id="custom-n" min="1" placeholder="—" oninput="onCustomInput()">
        <span>custom</span>
      </div>
    </div>
    <button class="start-btn" id="start-btn" onclick="startQuiz(null)" disabled>Start quiz →</button>
  </div>
</div>

<!-- ── PROGRESS BAR ── -->
<div id="quiz-header">
  <div class="progress-meta">
    <span id="prog-left">—</span>
    <span id="prog-sel">—</span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
</div>

<!-- ── QUIZ SCREEN ── -->
<div id="quiz-screen">
  <div class="quiz-container" id="quiz-container"></div>
</div>

<!-- ── STICKY SUBMIT BAR ── -->
<div id="submit-bar">
  <span class="submit-meta" id="submit-meta">—</span>
  <button class="submit-btn" onclick="submitQuiz()">Submit answers</button>
</div>

<!-- ── RESULTS PANEL ── -->
<div id="results-panel">
  <div class="results-summary">
    <h2>Results</h2>
    <div class="score-fraction" id="res-fraction">—</div>
    <div class="score-pct"     id="res-pct">—</div>
    <div class="results-pills">
      <div class="res-stat correct"><span class="val" id="res-correct">0</span><span class="lbl">Correct</span></div>
      <div class="res-stat wrong">  <span class="val" id="res-wrong">0</span>  <span class="lbl">Incorrect</span></div>
      <div class="res-stat skipped"><span class="val" id="res-skipped">0</span><span class="lbl">Skipped</span></div>
    </div>
    <div class="action-row">
      <button class="action-btn primary"   id="retry-btn" onclick="retryWrong()">Retry incorrect &amp; skipped</button>
      <button class="action-btn secondary" onclick="goToSetup()">New session</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────────────
let allQuestions    = [];  // full MC pool from JSON
let activeQuestions = [];  // subset for current session
let selections      = {};  // { qi: optionIndex }
let submitted       = false;
let chosenCount     = null;
let currentDataset  = 'quiz-data.json';  // selected dataset file

const PRESETS = [5, 10, 15, 20];
const LABELS  = ['a','b','c','d','e','f'];

// ─────────────────────────────────────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────────────────────────────────────
async function init() {
  await loadDataset(currentDataset);
}

async function loadDataset(filename) {
  setPlaceholder(`
    <div class="state-card">
      <div class="icon">⟳</div>
      <h3>Loading questions…</h3>
      <p>Fetching <code>${filename}</code></p>
    </div>`);

  try {
    const res = await fetch(filename);
    if (!res.ok) throw new Error(`HTTP ${res.status} — file not found`);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error('Expected a JSON array.');

    allQuestions = data.filter(q => q.type === 'multiple-choice');
    if (allQuestions.length === 0)
      throw new Error('No multiple-choice questions found in the file.');

    currentDataset = filename;
    setPlaceholder('');
    showSetup();
  } catch (err) {
    setPlaceholder(`
      <div class="state-card error">
        <div class="icon">✕</div>
        <h3>Could not load ${filename}</h3>
        <p>${escHtml(err.message)}<br><br>
        Make sure <code>${filename}</code> is in the same folder as this HTML file,
        then open it via a local server:<br>
        <code>python -m http.server 8000</code></p>
      </div>`);
  }
}

function setPlaceholder(html) {
  document.getElementById('state-placeholder').innerHTML = html;
}

// ─────────────────────────────────────────────────────────────────────────────
// SETUP
// ─────────────────────────────────────────────────────────────────────────────
function showSetup() {
  chosenCount = null;
  show('setup-screen');
  hide('quiz-header');
  hide('quiz-screen');
  hide('submit-bar');
  hide('results-panel');

  document.getElementById('custom-n').value = '';
  document.getElementById('start-btn').disabled = true;

  const total = allQuestions.length;
  document.getElementById('setup-sub').textContent =
    `${total} multiple-choice question${total !== 1 ? 's' : ''} available. Pick how many to practice.`;

  const pillsEl = document.getElementById('count-pills');
  pillsEl.innerHTML = '';

  PRESETS.forEach(n => {
    if (n > total) return;
    const btn = document.createElement('button');
    btn.className = 'pill';
    btn.textContent = String(n);
    btn.onclick = () => pickCount(n, btn);
    pillsEl.appendChild(btn);
  });

  if (total > (PRESETS[PRESETS.length - 1] || 0)) {
    const allBtn = document.createElement('button');
    allBtn.className = 'pill';
    allBtn.textContent = `All (${total})`;
    allBtn.onclick = () => pickCount(total, allBtn);
    pillsEl.appendChild(allBtn);
  }
}

function pickCount(n, btn) {
  chosenCount = n;
  document.getElementById('custom-n').value = '';
  document.querySelectorAll('#count-pills .pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('start-btn').disabled = false;
}

function onCustomInput() {
  const val = parseInt(document.getElementById('custom-n').value, 10);
  document.querySelectorAll('#count-pills .pill').forEach(p => p.classList.remove('active'));
  if (val >= 1 && val <= allQuestions.length) {
    chosenCount = val;
    document.getElementById('start-btn').disabled = false;
  } else {
    chosenCount = null;
    document.getElementById('start-btn').disabled = true;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// START QUIZ
// ─────────────────────────────────────────────────────────────────────────────
function startQuiz(pool) {
  submitted       = false;
  selections      = {};

  const source = pool || allQuestions;
  const n      = pool ? pool.length : Math.min(chosenCount, source.length);
  activeQuestions = shuffle([...source]).slice(0, n);

  hide('setup-screen');
  hide('results-panel');
  show('quiz-header',  'flex');
  show('quiz-screen');
  show('submit-bar',   'flex');

  renderQuiz();
  updateProgress();
  updateSubmitMeta();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────────────────────
function renderQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';

  activeQuestions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${qi}`;
    card.style.animationDelay = `${qi * 0.04}s`;

    let html = `
      <div class="card-header">
        <span class="q-number">Q${q.id}</span>
        <p class="q-text">${escHtml(q.question)}</p>
      </div>`;

    if (q.code) {
      html += `
        <div class="code-block">
          <div class="code-label">Python</div>
          <pre>${escHtml(q.code)}</pre>
        </div>`;
    }

    let opts = '';
    q.options.forEach((opt, oi) => {
      opts += `
        <button class="option-btn" id="opt-${qi}-${oi}" onclick="selectOption(${qi},${oi})">
          <span class="opt-key">${LABELS[oi] || oi}</span>${escHtml(opt)}
        </button>`;
    });

    html += `<div class="options-list">${opts}</div>`;
    html += `<p class="skipped-notice" id="skip-${qi}">No answer selected — marked as skipped.</p>`;
    html += `
      <div class="explanation" id="exp-${qi}">
        <div class="exp-label">Explanation</div>
        ${q.explanation || '—'}
      </div>`;

    card.innerHTML = html;
    container.appendChild(card);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// SELECTION (pre-submit)
// ─────────────────────────────────────────────────────────────────────────────
function selectOption(qi, oi) {
  if (submitted) return;

  const prev = selections[qi];
  // Deselect previous
  if (prev !== undefined)
    document.getElementById(`opt-${qi}-${prev}`).classList.remove('selected');

  // Toggle off if clicking same again
  if (prev === oi) {
    delete selections[qi];
  } else {
    selections[qi] = oi;
    document.getElementById(`opt-${qi}-${oi}`).classList.add('selected');
  }

  updateProgress();
  updateSubmitMeta();
}

// ─────────────────────────────────────────────────────────────────────────────
// SUBMIT
// ─────────────────────────────────────────────────────────────────────────────
function submitQuiz() {
  submitted = true;
  hide('submit-bar');

  let correct = 0, wrong = 0, skipped = 0;

  activeQuestions.forEach((q, qi) => {
    const card   = document.getElementById(`card-${qi}`);
    const chosen = selections[qi];
    const right  = q.answer;

    // Lock all buttons
    card.querySelectorAll('.option-btn').forEach(b => { b.disabled = true; });

    if (chosen === undefined) {
      skipped++;
      card.classList.add('result-skipped');
      document.getElementById(`skip-${qi}`).classList.add('visible');
      document.getElementById(`opt-${qi}-${right}`).classList.add('reveal-correct');
    } else if (chosen === right) {
      correct++;
      card.classList.add('result-correct');
      document.getElementById(`opt-${qi}-${chosen}`).classList.remove('selected');
      document.getElementById(`opt-${qi}-${chosen}`).classList.add('reveal-correct');
    } else {
      wrong++;
      card.classList.add('result-wrong');
      document.getElementById(`opt-${qi}-${chosen}`).classList.remove('selected');
      document.getElementById(`opt-${qi}-${chosen}`).classList.add('reveal-wrong');
      document.getElementById(`opt-${qi}-${right}`).classList.add('reveal-correct');
    }

    document.getElementById(`exp-${qi}`).classList.add('visible');
  });

  showResults(correct, wrong, skipped);
}

// ─────────────────────────────────────────────────────────────────────────────
// RESULTS
// ─────────────────────────────────────────────────────────────────────────────
function showResults(correct, wrong, skipped) {
  const total = activeQuestions.length;
  const pct   = Math.round((correct / total) * 100);

  document.getElementById('res-fraction').textContent = `${correct} / ${total}`;
  document.getElementById('res-pct').textContent =
    pct === 100 ? '🎉 Perfect score!' :
    pct >= 80   ? `${pct}% — Excellent work!` :
    pct >= 60   ? `${pct}% — Good effort, review the highlighted questions.` :
                  `${pct}% — Keep studying — check the explanations above.`;
  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-wrong').textContent   = wrong;
  document.getElementById('res-skipped').textContent = skipped;

  const retryBtn = document.getElementById('retry-btn');
  retryBtn.style.display = (wrong + skipped > 0) ? 'inline-block' : 'none';

  show('results-panel');
  document.getElementById('results-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function retryWrong() {
  const retry = activeQuestions.filter((q, qi) => {
    const chosen = selections[qi];
    return chosen === undefined || chosen !== q.answer;
  });
  startQuiz(retry);
}

function goToSetup() {
  showSetup();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─────────────────────────────────────────────────────────────────────────────
// PROGRESS & META
// ─────────────────────────────────────────────────────────────────────────────
function updateProgress() {
  const total  = activeQuestions.length;
  const sel    = Object.keys(selections).length;
  const pct    = total ? (sel / total) * 100 : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('prog-left').textContent     = `${total - sel} remaining`;
  document.getElementById('prog-sel').textContent      = `${sel} / ${total} selected`;
}

function updateSubmitMeta() {
  const total      = activeQuestions.length;
  const sel        = Object.keys(selections).length;
  const unanswered = total - sel;
  const meta = document.getElementById('submit-meta');
  if (unanswered === 0) {
    meta.innerHTML = `<strong>All ${total} answered</strong> — ready to submit!`;
  } else {
    meta.innerHTML = `<strong>${unanswered}</strong> unanswered — you can still submit now.`;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// DATASET SELECTOR
// ─────────────────────────────────────────────────────────────────────────────
async function selectDataset(filename, btn) {
  // Update UI
  document.querySelectorAll('#dataset-pills .pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  
  // Reload dataset
  await loadDataset(filename);
}

// ─────────────────────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function show(id, display = 'block') {
  document.getElementById(id).style.display = display;
}
function hide(id) {
  document.getElementById(id).style.display = 'none';
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

window.addEventListener('DOMContentLoaded', init);
</script>
